[project]
name = "receiptdesk"
version = "0.1.0"
requires-python = ">=3.11"
[project.scripts]
receiptdesk = "receiptdesk.__main__:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools]
packages = ["receiptdesk"]
